{% load static %}<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NaamAstro: shubh company naam, domain ke saath{% endblock %}</title>
  <meta name="description" content="Janm tarikh aur business ke hisaab se numerology-anukul company naam, har naam ka domain live check ke saath.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'suggester/app.css' %}">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="{% url 'home' %}"><span class="brand-mark" aria-hidden="true">N</span>NaamAstro</a>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="wrap">
      <p class="small">Ye suggestions numerology par based margdarshan hain. Domain ka status RDAP se live check hota hai, kharidne se pehle registrar par dobara confirm karein.</p>
    </div>
  </footer>

  <script src="{% static 'suggester/app.js' %}" defer></script>

</html>
